<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estudio Serenidad · Turnos</title>
<style>
:root{--fondo:#f4f1ec;--sup:#fff;--texto:#3a3a3a;--suave:#7a7a7a;--acento:#7f9bb3;--acento2:#58708a;--verde:#25d366;--wa:#e7f7ee;--borde:#e3ddd3;--sombra:0 2px 10px rgba(60,50,40,.08);--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--fondo);color:var(--texto);line-height:1.45;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,var(--acento),var(--acento2));color:#fff;padding:22px 18px 18px;text-align:center}
header h1{margin:0;font-size:1.35rem;font-weight:650}
header p{margin:6px 0 0;font-size:.85rem;opacity:.9}
nav{display:flex;background:#fff;border-bottom:1px solid var(--borde);position:sticky;top:0;z-index:5}
nav button{flex:1;border:none;background:none;padding:14px 6px;font-size:.95rem;font-weight:600;color:var(--suave);cursor:pointer;border-bottom:3px solid transparent;font-family:inherit}
nav button.active{color:var(--acento2);border-bottom-color:var(--acento)}
main{flex:1;padding:18px 14px 120px;max-width:640px;width:100%;margin:0 auto}
section.panel{display:none}
section.panel.active{display:block;animation:ap .18s ease}
@keyframes ap{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--sup);border-radius:var(--r);padding:16px;box-shadow:var(--sombra);border:1px solid var(--borde);margin-bottom:14px}
h2{font-size:1.05rem;margin:0 0 4px;color:var(--acento2)}
.sub{font-size:.82rem;color:var(--suave);margin:0 0 6px}
label{display:block;font-size:.82rem;font-weight:600;color:var(--suave);margin:14px 0 6px}
.card label:first-of-type{margin-top:0}
</style>
</head>
