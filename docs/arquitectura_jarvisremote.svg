<svg viewBox="0 0 1300 1600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arquitectura completa de JarvisRemote</title>
<desc>Diagrama de arquitectura mostrando el cerebro LLM compartido, el backend, las herramientas de PC y celular, la conectividad y el estado de seguridad.</desc>
<rect width="1300" height="1600" fill="#12141c"/>
<text x="650" y="45" text-anchor="middle" fill="#f5f5f5" font-family="Arial" font-size="26" font-weight="bold">JarvisRemote — Arquitectura completa</text>
<text x="650" y="72" text-anchor="middle" fill="#9aa0ac" font-family="Arial" font-size="15">Estado al 22/07/2026</text>
<rect x="425" y="100" width="450" height="80" rx="10" fill="#1e2a1e" stroke="#4caf50" stroke-width="2"/>
<text x="650" y="130" text-anchor="middle" fill="#e8f5e9" font-family="Arial" font-size="18" font-weight="bold">Jarvis — Qwen3 30B (LM Studio)</text>
<text x="650" y="155" text-anchor="middle" fill="#a5d6a7" font-family="Arial" font-size="13">Un unico cerebro compartido por ambos clientes (no son dos IAs)</text>
<line x1="650" y1="180" x2="650" y2="215" stroke="#5c6270" stroke-width="2"/>
<rect x="350" y="215" width="600" height="130" rx="10" fill="#1a1d27" stroke="#42a5f5" stroke-width="2"/>
<text x="650" y="242" text-anchor="middle" fill="#e3f2fd" font-family="Arial" font-size="17" font-weight="bold">Backend FastAPI (PC) - puerto 8000</text>
<text x="375" y="268" fill="#c5d5e5" font-family="Arial" font-size="13">Auth por API key (Bearer) en /api/chat y /ws/phone</text>
<text x="375" y="290" fill="#c5d5e5" font-family="Arial" font-size="13">Log de auditoria JSON rotado (audit.log)</text>
<text x="375" y="312" fill="#c5d5e5" font-family="Arial" font-size="13">Blocklist de comandos destructivos</text>
<text x="375" y="334" fill="#ffcc80" font-family="Arial" font-size="13">TLS preparado, apagado por default</text>
<line x1="500" y1="345" x2="280" y2="400" stroke="#5c6270" stroke-width="2"/>
<line x1="800" y1="345" x2="1010" y2="400" stroke="#5c6270" stroke-width="2"/>
<rect x="40" y="400" width="560" height="430" rx="10" fill="#1a1d27" stroke="#7e57c2" stroke-width="2"/>
<text x="320" y="432" text-anchor="middle" fill="#ede7f6" font-family="Arial" font-size="18" font-weight="bold">PC - Cliente + Herramientas</text>
<text x="65" y="462" fill="#c9c3e0" font-family="Arial" font-size="14" font-weight="bold">Tray App (chat local)</text>
<text x="65" y="495" fill="#c9c3e0" font-family="Arial" font-size="14" font-weight="bold">Herramientas:</text>
<text x="85" y="520" fill="#b8b3d0" font-family="Arial" font-size="13">- Filesystem (sandbox)</text>
<text x="85" y="544" fill="#b8b3d0" font-family="Arial" font-size="13">- Browser (Playwright)</text>
<text x="85" y="568" fill="#b8b3d0" font-family="Arial" font-size="13">- Control de escritorio total: screenshot, click,</text>
<text x="95" y="590" fill="#b8b3d0" font-family="Arial" font-size="13">  escribir, lanzar apps, foco de ventana, scroll</text>
<text x="65" y="625" fill="#ffab91" font-family="Arial" font-size="12">Riesgo aceptado: control total del escritorio</text>
<text x="65" y="647" fill="#ffab91" font-family="Arial" font-size="12">sin sandbox de UI</text>
<rect x="60" y="675" width="520" height="130" rx="8" fill="#161822" stroke="#3a3f4b" stroke-width="1"/>
<text x="320" y="700" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="13" font-weight="bold">Firewall Windows (puerto 8000)</text>
<text x="80" y="725" fill="#ef9a9a" font-family="Arial" font-size="12">Acepta cualquier IP en red "Privada"</text>
<text x="80" y="747" fill="#ef9a9a" font-family="Arial" font-size="12">   (no acotado a Tailscale/LAN de confianza)</text>
<text x="80" y="772" fill="#9aa0ac" font-family="Arial" font-size="12">Pendiente: requiere admin presente (UAC)</text>
<rect x="700" y="400" width="560" height="430" rx="10" fill="#1a1d27" stroke="#7e57c2" stroke-width="2"/>
<text x="980" y="432" text-anchor="middle" fill="#ede7f6" font-family="Arial" font-size="18" font-weight="bold">Celular (Moto G72) - Cliente + Herramientas</text>
<text x="725" y="462" fill="#c9c3e0" font-family="Arial" font-size="14" font-weight="bold">App Android (Compose) - chat</text>
<text x="725" y="495" fill="#c9c3e0" font-family="Arial" font-size="14" font-weight="bold">Herramientas:</text>
<text x="745" y="520" fill="#b8b3d0" font-family="Arial" font-size="13">- Accessibility Service: tap/swipe/escribir/leer</text>
<text x="755" y="540" fill="#b8b3d0" font-family="Arial" font-size="13">  pantalla - CUALQUIER app en pantalla</text>
<text x="745" y="564" fill="#b8b3d0" font-family="Arial" font-size="13">- Filesystem via SAF</text>
<text x="745" y="588" fill="#b8b3d0" font-family="Arial" font-size="13">- Termux (RUN_COMMAND): shell real, con blocklist</text>
<text x="725" y="618" fill="#ffcc80" font-family="Arial" font-size="12">API key: cifrado con Keystore listo,</text>
<text x="725" y="637" fill="#ffcc80" font-family="Arial" font-size="12">   falta instalar APK nuevo</text>
<rect x="720" y="665" width="520" height="140" rx="8" fill="#161822" stroke="#3a3f4b" stroke-width="1"/>
<text x="980" y="690" text-anchor="middle" fill="#e0e0e0" font-family="Arial" font-size="13" font-weight="bold">Accessibility Service - riesgo</text>
<text x="740" y="715" fill="#ef9a9a" font-family="Arial" font-size="12">Sin blocklist activo de apps sensibles</text>
<text x="740" y="737" fill="#ef9a9a" font-family="Arial" font-size="12">   (bancos, 2FA) todavia</text>
<text x="740" y="762" fill="#ffcc80" font-family="Arial" font-size="12">Codigo listo, falta instalar APK</text>
<text x="740" y="784" fill="#9aa0ac" font-family="Arial" font-size="12">Riesgo aceptado explicitamente por Damian</text>
<line x1="320" y1="830" x2="320" y2="865" stroke="#5c6270" stroke-width="2"/>
<line x1="980" y1="830" x2="980" y2="865" stroke="#5c6270" stroke-width="2"/>
<rect x="40" y="865" width="1220" height="175" rx="10" fill="#1a2530" stroke="#29b6f6" stroke-width="2"/>
<text x="650" y="895" text-anchor="middle" fill="#e1f5fe" font-family="Arial" font-size="17" font-weight="bold">Conectividad PC - Celular</text>
<text x="70" y="925" fill="#b3e5fc" font-family="Arial" font-size="13">LAN / Hotspot local - ruta directa, auto-detectada, menor latencia</text>
<text x="70" y="953" fill="#b3e5fc" font-family="Arial" font-size="13">Tailscale (WireGuard) - acceso remoto "desde cualquier lugar", PROBADO en vivo</text>
<text x="90" y="978" fill="#81c4de" font-family="Arial" font-size="12">   PC 100.116.29.74 - Celular 100.81.22.73 (confirmado con WiFi apagado, solo datos)</text>
<text x="70" y="1008" fill="#ce93d8" font-family="Arial" font-size="13">Futuro: LoRa / Meshtastic - radio de largo alcance sin internet (roadmap)</text>
<text x="70" y="1030" fill="#8a7a9a" font-family="Arial" font-size="12">   Necesario para escenario "sin internet, muy lejos de la PC" - no iniciado</text>
<rect x="40" y="1060" width="1220" height="215" rx="10" fill="#1a1d27" stroke="#5c6270" stroke-width="2"/>
<text x="650" y="1090" text-anchor="middle" fill="#f5f5f5" font-family="Arial" font-size="17" font-weight="bold">Estado de seguridad (auditoria 22/07/2026)</text>
<text x="70" y="1120" fill="#81c784" font-family="Arial" font-size="14" font-weight="bold">Activo hoy:</text>
<text x="90" y="1145" fill="#c8e6c9" font-family="Arial" font-size="13">Auth por API key / Blocklist de comandos destructivos / Log de auditoria</text>
<text x="670" y="1120" fill="#ffb74d" font-family="Arial" font-size="14" font-weight="bold">Pendiente (requiere Damian presente):</text>
<text x="690" y="1145" fill="#ffe0b2" font-family="Arial" font-size="13">Cifrado de API key (falta instalar APK)</text>
<text x="690" y="1167" fill="#ffe0b2" font-family="Arial" font-size="13">Blocklist apps bancarias/2FA (falta instalar APK)</text>
<text x="690" y="1189" fill="#ffe0b2" font-family="Arial" font-size="13">TLS en WebSocket (preparado, apagado)</text>
<text x="690" y="1211" fill="#ef9a9a" font-family="Arial" font-size="13">Firewall acotado a Tailscale/LAN (necesita admin/UAC)</text>
<text x="70" y="1245" fill="#9aa0ac" font-family="Arial" font-size="12">Protege ya contra: comandos destructivos y falta de trazabilidad.</text>
<text x="70" y="1265" fill="#9aa0ac" font-family="Arial" font-size="12">No protege aun contra: acceso fisico al celular ni trafico interceptado en LAN.</text>
<line x1="650" y1="1275" x2="650" y2="1310" stroke="#5c6270" stroke-width="2" stroke-dasharray="6,4"/>
<rect x="250" y="1310" width="800" height="260" rx="10" fill="#1e1a2a" stroke="#ab47bc" stroke-width="2" stroke-dasharray="8,5"/>
<text x="650" y="1342" text-anchor="middle" fill="#f3e5f5" font-family="Arial" font-size="17" font-weight="bold">Fase 2 - Casa inteligente (futuro, no iniciado)</text>
<text x="280" y="1372" fill="#d1c4e9" font-family="Arial" font-size="13">- Home Assistant - hub central (Raspberry Pi, Docker, o la misma PC)</text>
<text x="280" y="1397" fill="#d1c4e9" font-family="Arial" font-size="13">- ESPHome - integra robots/ESP32/Arduino custom (ej. auto a control remoto)</text>
<text x="280" y="1422" fill="#d1c4e9" font-family="Arial" font-size="13">- Impresion 3D (Klipper/OctoPrint) - mismo Raspberry Pi</text>
<text x="280" y="1447" fill="#d1c4e9" font-family="Arial" font-size="13">- Jarvis hablaria con Home Assistant via una sola herramienta,</text>
<text x="300" y="1470" fill="#d1c4e9" font-family="Arial" font-size="13">  no una integracion por dispositivo</text>
<text x="280" y="1505" fill="#9a8aad" font-family="Arial" font-size="12">Proximo paso real: definir que hardware especifico comprar/usar</text>
<text x="280" y="1527" fill="#9a8aad" font-family="Arial" font-size="12">(Raspberry Pi, dispositivos smart-home concretos)</text>
<text x="650" y="1595" text-anchor="middle" fill="#6b7280" font-family="Arial" font-size="12">activo y probado / listo pendiente de instalar-activar / pendiente / futuro-roadmap</text>
</svg>
